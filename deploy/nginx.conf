server {
    listen 80;
    listen [::]:80;
    server_name lorehub.zenogrid.co.kr;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lorehub.zenogrid.co.kr;

    # Docker Desktop may publish an unreachable IPv6 address for the host.
    # Resolve the coordinator dynamically and only use its IPv4 address.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $coordinator_http host.docker.internal:8080;
    set $coordinator_grpc host.docker.internal:8081;

    ssl_certificate /etc/letsencrypt/live/lorehub.zenogrid.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lorehub.zenogrid.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 32k;

    location /epic_urc.UrcAuthApi/ {
        grpc_pass grpc://$coordinator_grpc;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ucs.auth.RebacApi/ {
        grpc_pass grpc://$coordinator_grpc;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://$coordinator_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 65s;
    }
}
